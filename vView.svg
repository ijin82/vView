<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Purple Gradient (Vibrant Neon Purple to Deep Violet) -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>

    <!-- Glossy Neon Orange Gradient for the Handle Grip -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Shadow for the Paint Roller to pop out -->
    <filter id="roller-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="12" stdDeviation="10" flood-color="#11001c" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Transparent background container, only drawing the purple circle -->
  <g>
    <!-- Purple Circle Base -->
    <circle cx="256" cy="256" r="230" fill="url(#purple-grad)" filter="drop-shadow(0 8px 16px rgba(17, 0, 28, 0.4))" />

    <!-- Neon Teal Paint Stroke -->
    <path d="M 120 350 C 180 290, 260 270, 360 210" fill="none" stroke="#00f5d4" stroke-width="72" stroke-linecap="round" opacity="0.9" />

    <!-- Paint Roller Group with Drop Shadow -->
    <g filter="url(#roller-shadow)">
      <!-- Main translated and rotated roller group to match the stroke slope -->
      <g transform="translate(360, 210) rotate(-35)">
        <!-- Metal Frame -->
        <path d="M 0 0 L 0 -165 L -90 -165 L -90 -25" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Foam Roller Cylinder (Thicker diameter: 78px, length: 250px) -->
        <rect x="-129" y="-150" width="78" height="250" rx="16" fill="#ffffff" />
        
        <!-- Wet Paint on Foam Roller -->
        <rect x="-129" y="-105" width="78" height="205" fill="#00f5d4" />
        <!-- Curved paint boundary at the bottom of the roller -->
        <path d="M -129 100 Q -90 115 -51 100 L -51 -105 L -129 -105 Z" fill="#00f5d4" />

        <!-- End Caps for the Roller -->
        <ellipse cx="-90" cy="-150" rx="39" ry="11" fill="#475569" />
        <ellipse cx="-90" cy="100" rx="39" ry="11" fill="#475569" />

        <!-- Metal Pole Handle (Extended to fit the larger grip) -->
        <line x1="0" y1="0" x2="75" y2="87.5" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
        
        <!-- Larger, Glossy Orange Grip -->
        <rect x="59" y="42.5" width="32" height="90" rx="16" fill="url(#orange-grad)" transform="rotate(-40 75 87.5)" />
      </g>
    </g>
  </g>
</svg>
